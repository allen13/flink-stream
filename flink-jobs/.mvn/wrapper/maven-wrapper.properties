# Maven Wrapper: downloads Maven on first use, so the project needs no local Maven install.
# "only-script" means no maven-wrapper.jar is committed - the shell script does the download.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
