{{- if and .Values.snowflake.enabled (not .Values.snowflake.pat.existingSecret) }}
{{- if not .Values.snowflake.pat.value }}
{{- fail "snowflake.enabled is true but no token was provided: set snowflake.pat.existingSecret to a Secret you created, or snowflake.pat.value to the token itself." }}
{{- end }}
# Rendered only when the token is passed through values. That puts it in the Helm release secret as well as
# here, so it is the convenience path for a throwaway lab account rather than the one to use anywhere real -
# set snowflake.pat.existingSecret instead and create the Secret out of band:
#
#   kubectl -n {{ .Release.Namespace }} create secret generic snowflake-pat --from-literal=pat='<token>'
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flink-stream.snowflakePatSecret" . }}
  labels:
    {{- include "flink-stream.labels" . | nindent 4 }}
    app.kubernetes.io/component: snowflake
type: Opaque
stringData:
  {{ .Values.snowflake.pat.key }}: {{ .Values.snowflake.pat.value | quote }}
{{- end }}
