{{- if .Values.schemaRegistry.enabled }}
{{- $full := include "flink-stream.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-schema-registry
  labels:
    {{- include "flink-stream.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "flink-stream.selectorLabels" (dict "ctx" . "component" "schema-registry") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flink-stream.labels" . | nindent 8 }}
        app.kubernetes.io/component: schema-registry
    spec:
      containers:
        - name: schema-registry
          image: {{ .Values.schemaRegistry.image }}
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: {{ include "flink-stream.kafkaBootstrap" . | quote }}
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            # Schema Registry stores schemas in a compacted Kafka topic - it has no database of its own. Losing
            # the Kafka cluster loses the schemas, which is why _schemas is replicated like everything else.
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: "_schemas"
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: {{ .Values.kafka.defaults.replicationFactor | quote }}
            - name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL
              value: {{ .Values.schemaRegistry.compatibilityLevel | quote }}
            - name: SCHEMA_REGISTRY_HEAP_OPTS
              value: "-Xms256m -Xmx384m"
          readinessProbe:
            httpGet: { path: /subjects, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.schemaRegistry.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-schema-registry
  labels:
    {{- include "flink-stream.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-registry
spec:
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
  selector:
    {{- include "flink-stream.selectorLabels" (dict "ctx" . "component" "schema-registry") | nindent 4 }}
{{- end }}
