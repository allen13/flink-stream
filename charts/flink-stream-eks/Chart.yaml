apiVersion: v2
name: flink-stream-eks
description: >-
  The flink-stream Flink workloads on an existing Amazon EKS cluster: FlinkDeployments reconciled by an
  already-installed Confluent Flink Kubernetes Operator, checkpointing to S3, reading MSK (or any Kafka),
  writing Iceberg on S3 (Glue or REST catalog) and a Postgres-wire serving store. Brings no data
  infrastructure of its own.
type: application
version: 1.0.0
appVersion: "1.20.5"
keywords: [flink, kafka, msk, avro, iceberg, glue, eks, aws, streaming]
annotations:
  category: Analytics
