{{- if or .Values.flink.sql.enabled .Values.flink.session.enabled }}
{{- $full := include "flink-stream-eks.fullname" . }}
{{- $kafkaProps := include "flink-stream-eks.kafkaProperties" . | fromYaml }}
{{- $srProps := include "flink-stream-eks.schemaRegistryProperties" . | fromYaml }}
{{/*
Two injections turn the lab SQL - which is byte-identical to charts/flink-stream/files/sql, so the two charts
cannot drift - into SQL that can authenticate to a managed Kafka.

Each connector option is appended after an existing one as ",\n    'key' = 'value'", so it picks up that
option's trailing comma, or its absence at the end of a WITH block. The Schema Registry pattern captures the
format prefix, because the plain `kafka` tables spell it `avro-confluent.` and the `upsert-kafka` ones spell it
`value.avro-confluent.`.

With kafka.auth: none and schemaRegistry.auth: none both injections are empty and the files pass through
unchanged.
*/}}
{{- $kafkaInject := include "flink-stream-eks.sqlOptions" (dict "props" $kafkaProps "prefix" "properties.") }}
{{- $srInject := include "flink-stream-eks.sqlOptions" (dict "props" $srProps "prefix" "${1}.") }}
{{- $kafkaPattern := "'properties\\.bootstrap\\.servers'( *)= '\\$\\{KAFKA_BOOTSTRAP_SERVERS\\}'" }}
{{- $kafkaReplacement := printf "'properties.bootstrap.servers'${1}= '$${KAFKA_BOOTSTRAP_SERVERS}'%s" $kafkaInject }}
{{- $srPattern := "'((?:value\\.)?avro-confluent)\\.url'( *)= '\\$\\{SCHEMA_REGISTRY_URL\\}'" }}
{{- $srReplacement := printf "'${1}.url'${2}= '$${SCHEMA_REGISTRY_URL}'%s" $srInject }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-sql-labs
  labels:
    {{- include "flink-stream-eks.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-sql
data:
  # 00 is generated rather than shipped: the catalog is the one piece of the lab SQL that is genuinely different
  # on AWS, and templating it here means switching between Glue and a REST catalog is a values change.
  00-catalog.sql: |
    -- ===========================================================================================================
    -- 00 - Catalogs (generated by the flink-stream-eks chart)
    --
    -- Flink has no storage of its own. A *catalog* tells it where table metadata lives. Two are in play:
    --
    --   default_catalog  in-memory, dies with the job. Every Kafka table in 10/20 lives here, which is why that
    --                    DDL is re-executed on every submission - it IS the schema, versioned in git.
    --   {{ .Values.iceberg.name | printf "%-15s" }}  persistent. Tables here outlive the job and any other engine - Athena, Spark,
    --                    Trino, DuckDB - can read exactly what this pipeline wrote.
    --
    -- The Iceberg catalog is never made current with USE CATALOG: that would make an unqualified CREATE TABLE
    -- land in Iceberg, so Iceberg tables are always addressed by their full three-part name.
    --
    -- No credentials appear below. S3FileIO and the Glue client both use the AWS SDK's default credential
    -- chain, which on EKS resolves to the web identity token projected into the pod by IRSA.
    -- ===========================================================================================================
    {{- if .Values.iceberg.enabled }}
    {{- $opts := dict "type" "iceberg" "warehouse" (include "flink-stream-eks.icebergWarehouse" .) "io-impl" "org.apache.iceberg.aws.s3.S3FileIO" "client.region" .Values.aws.region }}
    {{- if eq .Values.iceberg.catalog "glue" }}
    {{- $_ := set $opts "catalog-impl" "org.apache.iceberg.aws.glue.GlueCatalog" }}
    {{- /* Glue keeps every version of a table definition unless told not to, and a streaming job commits a new
           one per checkpoint. Left on, a job checkpointing every 60s writes ~1400 archived versions a day. */}}
    {{- $_ := set $opts "glue.skip-archive" "true" }}
    {{- range $k, $v := .Values.iceberg.glue.extraOptions }}{{ $_ := set $opts $k $v }}{{ end }}
    {{- else if eq .Values.iceberg.catalog "rest" }}
    {{- $_ := set $opts "catalog-type" "rest" }}
    {{- $_ := set $opts "uri" (required "iceberg.rest.uri is required when iceberg.catalog is rest" .Values.iceberg.rest.uri) }}
    {{- if .Values.iceberg.rest.sigv4Enabled }}
    {{- $_ := set $opts "rest.sigv4-enabled" "true" }}
    {{- $_ := set $opts "rest.signing-name" .Values.iceberg.rest.signingName }}
    {{- $_ := set $opts "rest.signing-region" .Values.aws.region }}
    {{- end }}
    {{- range $k, $v := .Values.iceberg.rest.extraOptions }}{{ $_ := set $opts $k $v }}{{ end }}
    {{- else }}
    {{- fail (printf "iceberg.catalog: %q is not one of glue|rest" .Values.iceberg.catalog) }}
    {{- end }}

    CREATE CATALOG {{ .Values.iceberg.name }} WITH (
    {{- $last := len $opts }}{{ $i := 0 }}
    {{- range $k, $v := $opts }}{{ $i = add1 $i }}
        '{{ $k }}' = '{{ $v }}'{{ if lt $i $last }},{{ end }}
    {{- end }}
    );

    CREATE DATABASE IF NOT EXISTS {{ .Values.iceberg.name }}.{{ .Values.iceberg.database }};
    {{- else }}

    -- iceberg.enabled is false, so no catalog is created here. The INSERT statements in 20-sinks.sql that
    -- target {{ .Values.iceberg.name }}.{{ .Values.iceberg.database }} will fail to plan until they are removed.
    {{- end }}
{{- range $path, $_ := .Files.Glob "files/sql/*.sql" }}
  {{ base $path }}: |
{{- $body := $.Files.Get $path }}
{{- $body = regexReplaceAll $kafkaPattern $body $kafkaReplacement }}
{{- $body = regexReplaceAll $srPattern $body $srReplacement }}
{{ $body | indent 4 }}
{{- end }}
{{- end }}
