{{- if .Values.secret.create }}
{{- if .Values.secret.existingSecret }}
{{- fail "set either secret.create or secret.existingSecret, not both" }}
{{- end }}
# Convenience only. These values end up in the rendered manifest, and therefore in the release Secret that Helm
# keeps in the cluster - readable by anyone who can read Secrets in this namespace, including in `helm get
# manifest` output for every past revision. For anything real, sync a Secret from AWS Secrets Manager with the
# External Secrets Operator or the Secrets Store CSI driver and point secret.existingSecret at it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flink-stream-eks.secretName" . }}
  labels:
    {{- include "flink-stream-eks.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  {{- with .Values.secret.values.databasePassword }}
  {{ $.Values.secret.keys.databasePassword }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.values.kafkaSaslPassword }}
  {{ $.Values.secret.keys.kafkaSaslPassword }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.values.schemaRegistryPassword }}
  {{ $.Values.secret.keys.schemaRegistryPassword }}: {{ . | quote }}
  {{- end }}
{{- end }}
