{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "flink-stream-eks.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-rbac
  {{- if or .Values.serviceAccount.roleArn .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.serviceAccount.roleArn }}
    # IRSA. The EKS pod identity webhook sees this annotation and injects AWS_ROLE_ARN,
    # AWS_WEB_IDENTITY_TOKEN_FILE and a projected service-account token into every pod using this account; the
    # AWS SDK's default credential chain does the rest. The role's trust policy must allow
    # system:serviceaccount:{{ .Release.Namespace }}:{{ .Values.serviceAccount.name }} from this cluster's OIDC provider.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
    # Ask STS for a 1-hour session rather than the 15-minute default: a TaskManager holding an S3 upload open
    # across a long checkpoint should not have its credentials expire underneath it.
    eks.amazonaws.com/token-expiration: "3600"
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
